# Knot DNS: authoritative-only server for "pawprint.furry."
server:
    identity: "ns1.pawprint.furry"
    rundir: "/rundir"
    user: knot:knot
    listen: [ 0.0.0.0@53 ]

log:
  - target: stdout
    any: info

database:
    storage: "/storage"

template:
  - id: default
    storage: "/config"
    # Zone files are mounted read-only and edited by hand on the host.
    # Load the whole file on every reload and never write back to it.
    zonefile-load: whole
    zonefile-sync: -1
    journal-content: none
    semantic-checks: on

zone:
  - domain: "pawprint.furry."
    file: "pawprint.furry.zone"
